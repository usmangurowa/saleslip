name: Deploy to Coolify

on:
  push:
    branches:
      - main

concurrency:
  group: coolify-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Coolify deployments
    runs-on: ubuntu-latest
    steps:
      - name: Trigger manual GitHub webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ vars.COOLIFY_WEBHOOK_URL || 'http://195.179.227.24:8000/webhooks/source/github/events/manual' }}
          WEB_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET_WEB }}
          SERVER_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET_SERVER }}
        run: |
          set -euo pipefail

          # Minimal GitHub-push-shaped payload; Coolify needs ref, full_name,
          # and a commits array (it iterates commits for changed files).
          payload="$(jq -c '{ref, repository: {full_name: .repository.full_name}, commits: [(.commits // [])[] | {id, message, added, removed, modified}]}' "$GITHUB_EVENT_PATH")"

          deploy() {
            local name="$1" secret="$2"
            local sig
            sig="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$secret" | awk '{print $NF}')"
            local response
            response="$(curl -sS --max-time 30 -X POST "$COOLIFY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: push" \
              -H "X-GitHub-Delivery: ${GITHUB_RUN_ID}-${name}" \
              -H "X-Hub-Signature-256: sha256=${sig}" \
              -d "$payload")"
            echo "${name}: ${response}"
            # Each delivery matches both apps (same repo+branch); only the app
            # whose secret signed this request succeeds, so require >=1 success.
            if ! jq -e 'any(.[]; .status == "success")' <<<"$response" >/dev/null; then
              echo "::error::Coolify rejected the deploy for ${name}"
              exit 1
            fi
          }

          deploy web "$WEB_SECRET"
          deploy server "$SERVER_SECRET"