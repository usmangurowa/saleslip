<!doctype html>
<!--
  MikroTik hotspot captive portal — Saleslip voucher login.

  Self-contained by design: inline CSS, inline SVG, system fonts. No external
  requests (pre-auth DNS is unreliable). Mirrors the design reference at
  /portal in the web app. Upload to the router's `hotspot` directory.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    <title>Guest Wi-Fi</title>
    <style>
      /* Design tokens from DESIGN.md (Structured Restraint, light) */
      :root {
        --background: oklch(0.9851 0 0);
        --foreground: oklch(0.281 0 0);
        --card: oklch(1 0 0);
        --primary: oklch(0.5406 0.2549 262.56);
        --primary-foreground: oklch(1 0 0);
        --muted-foreground: oklch(0.478 0 0);
        --border: oklch(0.922 0 0);
        --input-border: oklch(0.87 0 0);
        --destructive: oklch(0.6256 0.1933 23.03);
        --shadow: 0 1px 2px 0 oklch(0 0 0 / 0.05);
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--background);
        color: var(--foreground);
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        line-height: 1.428571;
        letter-spacing: -0.15px;
        -webkit-font-smoothing: antialiased;
      }

      .backdrop {
        position: fixed;
        z-index: -1;
        width: 40rem;
        height: 40rem;
        border-radius: 9999px;
        background: oklch(0.281 0 0 / 5%);
        filter: blur(160px);
        pointer-events: none;
      }
      .backdrop.top {
        top: -10rem;
        right: -10rem;
      }
      .backdrop.bottom {
        bottom: -10rem;
        left: -10rem;
      }

      .panel {
        width: 100%;
        max-width: 24rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        text-align: center;
      }

      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 3rem;
        height: 3rem;
        margin-bottom: 0.75rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        box-shadow: var(--shadow);
        color: var(--primary);
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      .subtitle {
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }

      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }

      input[type="text"] {
        width: 100%;
        height: 2.75rem;
        padding: 0 0.75rem;
        font: inherit;
        font-size: 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.2em;
        text-align: center;
        color: var(--foreground);
        background: transparent;
        border: 1px solid var(--input-border);
        border-radius: 0.75rem;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px oklch(0.5406 0.2549 262.56 / 20%);
      }

      button {
        width: 100%;
        height: 2.75rem;
        margin-top: 1rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--primary-foreground);
        background: var(--primary);
        border: none;
        border-radius: 0.75rem;
        cursor: pointer;
      }
      button:active {
        background: oklch(0.48 0.23 262.56);
      }

      .error {
        margin-top: 0.5rem;
        color: var(--destructive);
        font-size: 0.75rem;
        text-align: center;
      }

      .hint {
        margin-top: 0.5rem;
        color: var(--muted-foreground);
        font-size: 0.75rem;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="backdrop top" aria-hidden="true"></div>
    <div class="backdrop bottom" aria-hidden="true"></div>

    <!-- MikroTik stock mechanics: hidden form used for CHAP logins -->
    <form
      name="sendin"
      action="$(link-login-only)"
      method="post"
      style="display: none"
    >
      <input type="hidden" name="username" />
      <input type="hidden" name="password" />
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
    </form>

    <main class="panel">
      <div class="brand">
        <div class="logo">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M21 10V13C21 16.7712 21 18.6569 19.8284 19.8284C18.6569 21 16.7712 21 13 21H11C7.22876 21 5.34315 21 4.17157 19.8284C3 18.6569 3 16.7712 3 13V11C3 7.22876 3 5.34315 4.17157 4.17157C5.34315 3 7.22876 3 11 3H14"
            />
            <path d="M10 3L15 20.5" />
            <path d="M3 13L12 11" />
            <path
              d="M19.5 2.9375V4.5M19.5 4.5V6.0625M19.5 4.5H18.25M19.5 4.5H20.75M22 4.5L20.9156 4.13852C20.4179 3.97263 20.0274 3.58211 19.8615 3.08443L19.5 2L19.1385 3.08443C18.9726 3.58211 18.5821 3.97263 18.0844 4.13852L17 4.5L18.0844 4.86148C18.5821 5.02737 18.9726 5.41789 19.1385 5.91557L19.5 7L19.8615 5.91557C19.9726 5.41789 20.4179 5.02737 20.9156 4.86148L22 4.5Z"
            />
          </svg>
        </div>
        <h1>You&rsquo;re almost online</h1>
        <p class="subtitle">Enter your voucher code to get online.</p>
      </div>

      <form
        name="login"
        action="$(link-login-only)"
        method="post"
        onsubmit="return doLogin()"
      >
        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />
        <input type="hidden" name="username" />
        <input type="hidden" name="password" />

        <label for="voucher">Voucher code</label>
        <input
          id="voucher"
          type="text"
          name="voucher"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="e.g. 8f3k2m"
        />

        <div id="router-error">
          $(if error)
          <p class="error" role="alert">$(error)</p>
          $(endif)
        </div>

        <p class="error" id="client-error" role="alert" hidden></p>

        <button type="submit">Connect</button>
        <p class="hint">
          One voucher per device. Ask reception if you don&rsquo;t have a code.
        </p>
      </form>
    </main>

    <script src="/md5.js"></script>
    <script>
      function doLogin() {
        var voucher = document.login.voucher.value.trim();
        if (!voucher) {
          var err = document.getElementById("client-error");
          err.textContent = "Voucher code is required";
          err.hidden = false;
          document.login.voucher.focus();
          return false;
        }

        // The voucher doubles as both username and password.
        document.login.username.value = voucher;
        document.login.password.value = voucher;

        if ("$(chap-challenge)" == "") {
          return true;
        }

        document.sendin.username.value = voucher;
        // RouterOS http-chap expects MD5(chap-id + password + chap-challenge)
        // as a single concatenated string — hexMD5 takes one argument.
        document.sendin.password.value = hexMD5(
          "$(chap-id)" + voucher + "$(chap-challenge)",
        );
        document.sendin.submit();
        return false;
      }

      var routerError = document.getElementById("router-error");
      if (routerError && routerError.textContent.indexOf("$(error)") !== -1) {
        routerError.remove();
      }

      document.getElementById("voucher").focus();
    </script>
  </body>
</html>
