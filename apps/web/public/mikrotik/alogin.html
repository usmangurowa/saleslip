<!doctype html>
<!--
  MikroTik hotspot — post-login page (alogin.html).

  Shown briefly after a successful voucher or trial login, then forwards
  the guest to their original destination ($(link-redirect)). The voucher
  doubles as the username, so it is echoed back here as confirmation.
  Self-contained like login.html: inline CSS, inline SVG, system fonts,
  and NO JavaScript at all — the auto-forward is a meta refresh, so even
  the oldest portal browser renders it. Upload to the router's `hotspot`
  directory alongside login.html.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="3; url=$(link-redirect)" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    <title>You&rsquo;re online &mdash; Guest Wi-Fi</title>
    <style>
      /* Design tokens from DESIGN.md (Structured Restraint, light) */
      :root {
        --background: oklch(0.9851 0 0);
        --foreground: oklch(0.281 0 0);
        --card: oklch(1 0 0);
        --primary: oklch(0.5406 0.2549 262.56);
        --primary-foreground: oklch(1 0 0);
        --muted-foreground: oklch(0.478 0 0);
        --border: oklch(0.922 0 0);
        --input-border: oklch(0.87 0 0);
        --shadow: 0 1px 2px 0 oklch(0 0 0 / 0.05);
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--background);
        color: var(--foreground);
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        line-height: 1.428571;
        letter-spacing: -0.15px;
        -webkit-font-smoothing: antialiased;
      }

      .backdrop {
        position: fixed;
        z-index: -1;
        width: 40rem;
        height: 40rem;
        border-radius: 9999px;
        background: oklch(0.281 0 0 / 5%);
        filter: blur(160px);
        pointer-events: none;
      }
      .backdrop.top {
        top: -10rem;
        right: -10rem;
      }
      .backdrop.bottom {
        bottom: -10rem;
        left: -10rem;
      }

      .panel {
        width: 100%;
        max-width: 24rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        text-align: center;
      }

      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 3rem;
        height: 3rem;
        margin-bottom: 0.5rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        box-shadow: var(--shadow);
        color: var(--primary);
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      .subtitle {
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }

      .label {
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }

      /* Mirrors the voucher input on login.html so the code reads as the
         same field, now confirmed and locked in. */
      .code-box {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 3.25rem;
        font-size: 1.25rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.375em;
        color: var(--foreground);
        background: var(--card);
        border: 1px solid var(--input-border);
        border-radius: 0.75rem;
      }

      .hint {
        color: var(--muted-foreground);
        font-size: 0.75rem;
        text-align: center;
      }

      .divider {
        border: none;
        border-top: 1px solid var(--border);
      }

      .go {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 2.75rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--primary-foreground);
        background: var(--primary);
        border: none;
        border-radius: 0.75rem;
        text-decoration: none;
      }
      .go:active {
        background: oklch(0.48 0.23 262.56);
      }

      .text-link {
        display: block;
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted-foreground);
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="backdrop top" aria-hidden="true"></div>
    <div class="backdrop bottom" aria-hidden="true"></div>

    <main class="panel">
      <div class="brand">
        <div class="logo">
          <!-- Saleslip wifi mark — same paths as the web app icon -->
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path d="M2.5 9.5a13.5 13.5 0 0 1 19 0" />
            <path d="M5.5 12.75a9 9 0 0 1 13 0" />
            <path d="M8.5 16a4.5 4.5 0 0 1 7 0" />
            <circle cx="12" cy="19.5" r="1" fill="currentColor" stroke="none" />
          </svg>
        </div>
        <h1>You&rsquo;re online</h1>
        <p class="subtitle">Connected to Saleslip Guest Wi-Fi.</p>
      </div>

      $(if login-by == 'trial')
      <p class="hint">You&rsquo;re on the free 5-minute trial session.</p>
      $(elif login-by != 'mac')
      <section>
        <p class="label">Voucher code</p>
        <div class="code-box">$(username)</div>
      </section>
      $(endif)

      <p class="hint">Taking you there now&hellip;</p>

      <a class="go" href="$(link-redirect)">Continue</a>

      <hr class="divider" />

      <a class="text-link" href="$(link-status)">View session info</a>
    </main>
  </body>
</html>
